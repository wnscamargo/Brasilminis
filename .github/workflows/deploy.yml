name: Build & Deploy Brasil Minis (Locaweb)

# Pipeline de BUILD + DEPLOY para hospedagem compartilhada Locaweb (PHP 8.3).
#
# Por que este pipeline existe:
#   A Locaweb desabilita funções PHP essenciais para o Composer/Node em runtime
#   (php_strip_whitespace, proc_open, exec, shell_exec, system, symlink).
#   Por isso NADA de build roda na Locaweb. Todo o build (composer + vite) acontece
#   aqui no GitHub Actions e apenas o ARTEFATO PRONTO (com vendor/ e public/build/)
#   é enviado por rsync/SSH. A Locaweb apenas executa comandos Artisan pós-deploy.
#
# NÃO faz merge na main. Só roda na branch laravel-migration (ou manualmente).
#
# GitHub Secrets necessários (Settings > Secrets and variables > Actions):
#   LOCAWEB_HOST         host SSH da Locaweb
#   LOCAWEB_USER         usuário SSH
#   LOCAWEB_PORT         porta SSH (ex.: 22)
#   LOCAWEB_SSH_KEY      chave PRIVADA SSH (conteúdo completo)
#   LOCAWEB_PATH         /home/storage/d/6c/81/brasilminis1/brasilminis/laravel
#   LOCAWEB_PUBLIC_PATH  /home/storage/d/6c/81/brasilminis1/public_html
# Nenhum valor sensível fica no YAML.

on:
  push:
    branches: [ laravel-migration ]
  workflow_dispatch: {}

concurrency:
  group: deploy-locaweb
  cancel-in-progress: true

defaults:
  run:
    working-directory: laravel

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- BUILD (PHP) ----------
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2

      - name: Validar composer.lock (obrigatório)
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock não encontrado. Gere localmente ('composer install') e faça commit antes do deploy."
            exit 1
          fi
          composer validate --no-check-all --no-check-publish

      - name: Composer install (produção, autoload otimizado)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # ---------- BUILD (assets Vite) ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build de assets (Vite) -> public/build
        run: |
          yarn install
          yarn build

      # ---------- Testes (não bloqueia deploy) ----------
      - name: Testes (Pest, SQLite em memória)
        run: |
          cp .env.example .env
          php artisan key:generate
          ./vendor/bin/pest || echo "Testes falharam/ausentes — seguindo (não bloqueante)."
          rm -f .env

      # ---------- Preparar artefato ----------
      - name: Preparar diretórios do artefato
        run: |
          rm -rf bootstrap/cache/*.php || true
          mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs public/uploads

      # ---------- DEPLOY ----------
      - name: Configurar chave SSH
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LOCAWEB_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.LOCAWEB_PORT }}" -H "${{ secrets.LOCAWEB_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy da aplicação Laravel (rsync -> LOCAWEB_PATH, FORA do public_html)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.LOCAWEB_PORT }} -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/uploads/' \
            ./ \
            "${{ secrets.LOCAWEB_USER }}@${{ secrets.LOCAWEB_HOST }}:${{ secrets.LOCAWEB_PATH }}/"

      - name: Publicar pasta pública (rsync public/ -> public_html) + index.php do public_html
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.LOCAWEB_PORT }} -o StrictHostKeyChecking=accept-new" \
            --exclude 'uploads/' \
            --exclude '.env' \
            --exclude 'index.php' \
            public/ \
            "${{ secrets.LOCAWEB_USER }}@${{ secrets.LOCAWEB_HOST }}:${{ secrets.LOCAWEB_PUBLIC_PATH }}/"
          # index.php específico do public_html (carrega o Laravel fora da pasta pública)
          scp -i ~/.ssh/deploy_key -P "${{ secrets.LOCAWEB_PORT }}" -o StrictHostKeyChecking=accept-new \
            deploy/public_html_index.php \
            "${{ secrets.LOCAWEB_USER }}@${{ secrets.LOCAWEB_HOST }}:${{ secrets.LOCAWEB_PUBLIC_PATH }}/index.php"

      - name: Pós-deploy na Locaweb (Artisan via php83 — sem composer/npm)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOCAWEB_HOST }}
          username: ${{ secrets.LOCAWEB_USER }}
          port: ${{ secrets.LOCAWEB_PORT }}
          key: ${{ secrets.LOCAWEB_SSH_KEY }}
          script_stop: false
          script: |
            PHP=/usr/bin/php83
            APP="${{ secrets.LOCAWEB_PATH }}"
            PUB="${{ secrets.LOCAWEB_PUBLIC_PATH }}"
            cd "$APP" || exit 1

            # Garante diretórios graváveis e uploads públicos (sem symlink)
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/logs bootstrap/cache "$PUB/uploads"
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            # Migrations NUNCA destrutivas (jamais migrate:fresh / db:wipe em produção)
            $PHP artisan migrate --force || echo "AVISO: migrate falhou — verificar DB_* no .env"

            # Caches: se alguma função bloqueada interferir, faz fallback sem derrubar o deploy
            $PHP artisan config:cache || { echo "config:cache falhou — usando config:clear"; $PHP artisan config:clear || true; }
            $PHP artisan route:cache  || { echo "route:cache falhou — usando route:clear";   $PHP artisan route:clear  || true; }
            $PHP artisan view:cache   || { echo "view:cache falhou — usando view:clear";      $PHP artisan view:clear   || true; }

            echo "Pós-deploy concluído (storage:link NÃO usado — symlink bloqueado na Locaweb)."
