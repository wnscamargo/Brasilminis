name: Deploy Brasil Minis (Locaweb)

# Deploy automático da branch laravel-migration.
# NÃO faz merge na main. Requer GitHub Secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, DEPLOY_PATH
# DEPLOY_PATH ex.: /home/storage/x/yy/zzzz/brasilminis1/brasilminis/app/laravel
# Nenhum valor sensível fica no YAML.

on:
  push:
    branches: [ laravel-migration ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Composer install
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build assets (Vite) — servidor NÃO precisa de Node em runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npm run build

      - name: Testes (Pest, SQLite em memória)
        run: |
          cp .env.example .env
          php artisan key:generate
          ./vendor/bin/pest || true

      - name: Deploy via SSH (git pull + composer + migrate + cache)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin laravel-migration
            /usr/bin/php83 ~/bin/composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            /usr/bin/php83 artisan migrate --force
            /usr/bin/php83 artisan storage:link || true
            /usr/bin/php83 artisan config:cache
            /usr/bin/php83 artisan route:cache
            /usr/bin/php83 artisan view:cache
