# Brasil Minis — Nginx (produção, Ubuntu 24.04)
# Frontend React (build estático) na raiz + proxy /api -> FastAPI (Gunicorn/Uvicorn) em 127.0.0.1:8000.
#
# SEGURANÇA (anti-spoofing de X-Forwarded-For):
#   O backend usa o PRIMEIRO valor de X-Forwarded-For para rate limiting. Para impedir
#   que um cliente da internet injete um IP falso, o Nginx SOBRESCREVE o header com o IP
#   real do peer (`$remote_addr`) usando `proxy_set_header X-Forwarded-For $remote_addr;`
#   (NÃO usar $proxy_add_x_forwarded_for aqui, pois ele preservaria o valor enviado pelo cliente).
#   X-Real-IP também é fixado no IP real. Como só há UM proxy confiável (este Nginx), isso é seguro.

# Cache de assets estáticos com hash (CRA gera /static/**.[hash].ext)
map $sent_http_content_type $bm_cache_control {
    default                         "no-cache";
    ~*application/javascript        "public, max-age=31536000, immutable";
    ~*text/css                      "public, max-age=31536000, immutable";
    ~*image/                        "public, max-age=2592000";
    ~*font/                         "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name brasilminis.com www.brasilminis.com;

    # Desafio do Let's Encrypt (deixe acessível por HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/brasilminis/frontend/build;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brasilminis.com www.brasilminis.com;

    # Certificados (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/brasilminis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brasilminis.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/brasilminis/frontend/build;
    index index.html;

    client_max_body_size 25m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml font/ttf font/otf;

    # ---- API -> FastAPI (Gunicorn/Uvicorn) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # SOBRESCREVE (não anexa) para evitar spoofing do primeiro hop:
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ---- Assets estáticos com cache agressivo ----
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA React: fallback para index.html ----
    location / {
        add_header Cache-Control $bm_cache_control;
        try_files $uri $uri/ /index.html;
    }
}
